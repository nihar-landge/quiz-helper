<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Plain quiz (no fieldset)</title>
    <style>
      body { font: 15px/1.6 -apple-system, system-ui, sans-serif; max-width: 640px; margin: 40px auto; }
      .q { margin: 24px 0; }
      h3 { margin: 0 0 8px; }
      label { display: block; }
    </style>
  </head>
  <body>
    <h1>Plain markup quiz</h1>
    <div class="q">
      <h3>Who wrote the play "Macbeth"?</h3>
      <label><input type="radio" name="p1" /> A) Charles Dickens</label>
      <label><input type="radio" name="p1" /> B) William Shakespeare</label>
      <label><input type="radio" name="p1" /> C) Jane Austen</label>
      <label><input type="radio" name="p1" /> D) Mark Twain</label>
    </div>
    <div class="q">
      <h3>What is the largest ocean on Earth?</h3>
      <label><input type="radio" name="p2" /> A) Atlantic</label>
      <label><input type="radio" name="p2" /> B) Indian</label>
      <label><input type="radio" name="p2" /> C) Pacific</label>
      <label><input type="radio" name="p2" /> D) Arctic</label>
    </div>
  </body>
</html>
