<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        width: 240px;
        margin: 0;
        padding: 14px;
        font: 12px/1.5 -apple-system, system-ui, sans-serif;
        color: #ddd;
        background: #1c1c1e;
      }
      .st { display: flex; align-items: center; gap: 6px; margin-bottom: 10px; }
      .dot { width: 8px; height: 8px; border-radius: 50%; background: #666; }
      .ok .dot { background: #4caf78; }
      .bad .dot { background: #c06060; }
      .hint { color: #888; }
      .opt {
        display: flex; align-items: center; gap: 6px; margin: 10px 0 2px;
        color: #bbb; font-size: 11px; cursor: pointer;
      }
      kbd {
        background: #333; border-radius: 4px; padding: 1px 5px;
        font-family: inherit; font-size: 11px; color: #ccc;
      }
      button {
        margin-top: 10px; width: 100%; padding: 6px;
        background: #2e2e30; color: #ddd; border: 1px solid #444;
        border-radius: 6px; cursor: pointer; font-size: 12px;
      }
      button:hover { background: #38383a; }
      #msg { margin-top: 8px; color: #999; font-size: 11px; word-break: break-word; }
      body { width: 280px; }
      .histhead {
        margin: 12px 0 4px; color: #777; font-size: 10px;
        letter-spacing: .06em; display: flex; justify-content: space-between;
      }
      #clear { cursor: pointer; color: #888; }
      #clear:hover { color: #ccc; }
      .ans {
        background: #262628; border: 1px solid #38383a; border-radius: 6px;
        padding: 5px 7px; margin-bottom: 4px; font-size: 11px; line-height: 1.4;
      }
      .ans b { color: #eee; }
      .ans .a { color: #9a9a9a; }
      .ans .qn { color: #777; font-size: 10px; white-space: nowrap;
        overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
      .ans.err b { color: #b07070; }
      .empty { color: #666; font-size: 11px; padding: 2px 0 6px; }
    </style>
  </head>
  <body>
    <div class="st" id="status"><span class="dot"></span><span id="sttext">checking…</span></div>
    <div class="hint">
      Click inside a question, press <kbd>⌥</kbd><kbd>A</kbd>. Press <kbd>⌥</kbd><kbd>Q</kbd>
      to answer all detected questions. Answers arrive as macOS notifications — nothing appears on the page.
    </div>
    <label class="opt"><input type="checkbox" id="speak" /> Speak answers (hear them — e.g. AirPods)</label>
    <label class="opt"><input type="checkbox" id="notify" checked /> macOS notifications (answer appears briefly in corner)</label>
    <button id="retry">Re-check connection</button>
    <div id="msg"></div>
    <div class="histhead">Recent answers <span id="clear" title="clear">clear</span></div>
    <div id="answers"></div>
    <script src="popup.js"></script>
  </body>
</html>
