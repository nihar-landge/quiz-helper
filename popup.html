<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        width: 240px;
        margin: 0;
        padding: 14px;
        font: 12px/1.5 -apple-system, system-ui, sans-serif;
        color: #ddd;
        background: #1c1c1e;
      }
      .st { display: flex; align-items: center; gap: 6px; margin-bottom: 10px; }
      .dot { width: 8px; height: 8px; border-radius: 50%; background: #666; }
      .ok .dot { background: #4caf78; }
      .bad .dot { background: #c06060; }
      .hint { color: #888; }
      .opt {
        display: flex; align-items: center; gap: 6px; margin: 10px 0 2px;
        color: #bbb; font-size: 11px; cursor: pointer;
      }
      kbd {
        background: #333; border-radius: 4px; padding: 1px 5px;
        font-family: inherit; font-size: 11px; color: #ccc;
      }
      button {
        margin-top: 10px; width: 100%; padding: 6px;
        background: #2e2e30; color: #ddd; border: 1px solid #444;
        border-radius: 6px; cursor: pointer; font-size: 12px;
      }
      button:hover { background: #38383a; }
      #msg { margin-top: 8px; color: #999; font-size: 11px; word-break: break-word; }
    </style>
  </head>
  <body>
    <div class="st" id="status"><span class="dot"></span><span id="sttext">checking…</span></div>
    <div class="hint">
      Click inside a question, press <kbd>⌥</kbd><kbd>A</kbd> — the answer shows
      only in the small corner panel. <kbd>⌥</kbd><kbd>Q</kbd> answers all
      detected questions. Nothing appears next to the question.
    </div>
    <label class="opt"><input type="checkbox" id="speak" /> Speak answers (hear them — e.g. AirPods)</label>
    <button id="retry">Re-check connection</button>
    <div id="msg"></div>
    <script src="popup.js"></script>
  </body>
</html>
